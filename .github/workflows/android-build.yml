name: Build APK and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK and publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Works both ways:
      #  1) project files are at the repo root, or
      #  2) a single project .zip was uploaded to the repo root (it gets unzipped here).
      - name: Locate project (unzip if needed)
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT_DIR=.
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::No Gradle project at the repo root and no .zip file found. Upload the project zip to the repo root."
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p _project
            unzip -q "$ZIP" -d _project
            if [ -f _project/settings.gradle.kts ] || [ -f _project/settings.gradle ]; then
              PROJECT_DIR=_project
            else
              SUB=$(find _project -maxdepth 2 -name 'settings.gradle*' -print -quit)
              if [ -z "$SUB" ]; then
                echo "::error::settings.gradle(.kts) not found inside $ZIP"
                exit 1
              fi
              PROJECT_DIR=$(dirname "$SUB")
            fi
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "dist/Zarvimo-Video-Editor-debug-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarvimo-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Zarvimo Video Editor - build #${{ github.run_number }}" \
            --notes "Debug APK built automatically by GitHub Actions (commit ${GITHUB_SHA:0:7})."
